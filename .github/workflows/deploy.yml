name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client SPA
        run: bun run build

      - name: Check build output
        run: |
          echo "Checking generated files..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist was not created."
            exit 1
          fi

          echo "Build output:"
          find dist -maxdepth 2 -type f | head -100

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Static SPA build verified successfully."

      - name: Deploy to cPanel via SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "dist/*"
          target: "/home/nhwjktyx/public_html/"
          overwrite: true
          strip_components: 1
