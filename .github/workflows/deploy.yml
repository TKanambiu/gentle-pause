name: Build and deploy static site to cPanel (FTPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static website
        run: bun run build

      - name: Verify deployable files
        shell: bash
        run: |
          test -s dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }
          test -f dist/.htaccess || { echo 'ERROR: dist/.htaccess missing'; exit 1; }
          test -d dist/assets || { echo 'ERROR: dist/assets missing'; exit 1; }
          echo 'Static build verified; ready to upload dist/.'

      - name: Check required GitHub secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 1
            fi
          done
          if [[ "${FTP_SERVER_DIR}" != */ ]]; then
            echo '::error::FTP_SERVER_DIR must end in /'
            exit 1
          fi

      - name: Upload build to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          log-level: standard
